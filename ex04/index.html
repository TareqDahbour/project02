<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 04 - The Box Model</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>The Box Model</h1>
  <div class="comparison">
    <div class="wrapper">
      <div class="box content-box">content-box</div>
      <p>width: 200px + padding 20px + border 10px per side<br>
         = <strong>260px</strong> total width</p>
    </div>
    <div class="wrapper">
      <div class="box border-box">border-box</div>
      <p>width: 200px includes padding and border<br>
         = <strong>200px</strong> total width</p>
    </div>
  </div>
</body>
</html>
